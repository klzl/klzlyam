# ==========================================================
# ACL4SSR 在线版 → Mihomo YAML
# ==========================================================

proxy-groups:

  # ==========================================================
  # 节点选择
  # ==========================================================
  - name: 🚀 节点选择
    type: select
    proxies:
      - ♻️ 自动选择
      - DIRECT
    include-all: true

  # ==========================================================
  # 自动测速
  # ==========================================================
  - name: ♻️ 自动选择
    type: url-test
    include-all: true
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  # ==========================================================
  # 全球直连
  # ==========================================================
  - name: 🎯 全球直连
    type: select
    proxies:
      - DIRECT
      - 🚀 节点选择
      - ♻️ 自动选择

  # ==========================================================
  # 全球拦截
  # ==========================================================
  - name: 🛑 全球拦截
    type: select
    proxies:
      - REJECT
      - DIRECT

  # ==========================================================
  # 漏网之鱼
  # ==========================================================
  - name: 🐟 漏网之鱼
    type: select
    proxies:
      - 🚀 节点选择
      - 🎯 全球直连
      - ♻️ 自动选择
    include-all: true


